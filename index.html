<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>TaskFlow - My project</h1>
       <p>Organise your tasks, one step at a time.</p>

        <form id="task-form">
            <input id="task-input" type="text"
                   placeholder="Enter a new task" required>
            <button type="submit">Add Tasknow</button>
        </form>

        <ul id="task-list"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
